packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts. pnpm blocks these by default and
# asks; each entry is a deliberate answer, not a default.
allowBuilds:
  # The OpenSpec CLI. Its postinstall only prints a shell-completion hint, and
  # it already self-skips when CI=true. The CLI works without it, so there is
  # nothing to gain by running it and one less install script to trust.
  '@fission-ai/openspec': false
  # Optional DTrace bindings for bunyan, the logger inside eas-cli. They compile
  # native code to feed a tracing facility nothing here uses, and bunyan detects
  # their absence and logs identically without them. eas-cli is fully functional
  # either way, so there is nothing to gain by running the build.
  dtrace-provider: false
  # Vitest's bundler. Its postinstall fetches the platform binary — without it
  # every test run fails to start.
  esbuild: true
  # Next's image optimiser. Nothing renders an image yet, and Next falls back
  # cleanly without it. Flip to true when production image optimisation matters.
  sharp: false
  # Native resolver used by the eslint import plugin. The JS fallback is
  # slower but correct; skipping the native build keeps installs portable.
  unrs-resolver: false

# Required by Expo + React Native in pnpm monorepos.
#
# RN libraries resolve sibling packages via bare `require()` at Metro-config
# load time. pnpm's default isolated linker breaks those resolutions, and the
# failure surfaces as an unrelated-looking "Cannot find module" while loading
# metro.config.js. Hoisted gives a flat, npm-style layout that RN needs and
# that Next is indifferent to.
# https://docs.expo.dev/guides/monorepos/#pnpm
#
# This setting lives HERE and not in `.npmrc`: pnpm 11 no longer reads settings
# from `.npmrc` (https://pnpm.io/settings). Putting it there produces no error
# — it is silently ignored, the install comes out isolated, and you debug Metro
# instead of the linker. Do not move it back.
#
# Note the direction is one-way: isolated -> hoisted is safe, hoisted ->
# isolated surfaces every accumulated phantom dependency at once. We are on
# hoisted from the first commit because apps/mobile exists from the first
# commit.
nodeLinker: hoisted

publicHoistPattern:
  - '*eslint*'
  - '*next*'
