# CI for the pinpoint monorepo (apps/web + apps/mobile + packages/).
# Runs on every PR targeting main and every push to main.
#
# Jobs run in parallel:
#   quality          eslint + tsc --noEmit for both apps
#   web-build        next build with placeholder config
#   packages-test    vitest for the shared packages
#   workspace-health lockfile freshness + duplicate runtime deps + graph cycles
#                    + the generated OpenSpec workflows stay at five
#
# Mobile is linted and typechecked but not built: a native build needs a dev
# build toolchain, which this change deliberately defers. Metro resolution is
# covered by the mobile typecheck, which fails if a workspace package stops
# resolving.
#
# Node comes from .nvmrc everywhere. Do not inline a version here — one pin,
# one file, or the jobs drift apart from each other and from local machines.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; never cancel on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter web lint

      - name: Lint mobile
        run: pnpm --filter mobile lint

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

      - name: Typecheck packages
        run: pnpm --filter "./packages/*" typecheck

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Placeholders. CI never contacts Supabase, so real credentials are
          # not needed — but the config module validates presence at startup,
          # so the build fails without something here. That is the intended
          # behaviour, exercised on every run.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_ci
        run: pnpm --filter web build

  packages-test:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter "./packages/*" test

  workspace-health:
    name: Workspace health
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because "Check the change was archived" diffs this branch
      # against its base, and a shallow clone has no merge base to diff from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails when pnpm-lock.yaml is stale relative to any
      # manifest in the workspace. Catches PRs that change a dependency and
      # forget the lockfile.
      - name: Validate lockfile freshness
        run: pnpm install --frozen-lockfile

      # @pinpoint/tokens holds one authoritative definition and two derived
      # representations — literals for native, custom properties for web.
      # Regenerating and failing on a diff is what keeps "derived" from
      # degrading into "was derived once": without it a hand-edit to a
      # generated file survives indefinitely, and the two platforms drift
      # apart one colour at a time.
      - name: Check derived tokens are current
        run: pnpm check:tokens

      # A missing or mismatched font file is silent on both platforms: the face
      # falls back to a system one, every measurement on the screen changes, and
      # no build, typecheck or lint has anything to say about it.
      - name: Check the bundled typeface
        run: pnpm check:fonts

      # The product's icons are binaries nobody reads and the Android background
      # is a string that is valid whatever it says, so a disagreement between
      # them is invisible to every other check. It has already happened once:
      # five icons cut by hand in two sittings came out as two different
      # drawings, and it was found by a person looking at two home screens.
      - name: Check every icon is still the mark
        run: pnpm check:icons

      # Every table this repository creates has to be protected and reachable,
      # and the two fail in opposite directions. A migration that forgets row
      # level security ships a table any signed-in account can read and write in
      # full — the browser holds a key that reaches the database directly — and
      # nothing else catches it: the app works, the tests pass, and the only
      # symptom is data being available to people who should not have it. A
      # migration that forgets the grant ships a table nobody can reach, which
      # hid for eight migrations because the hosted database was covering for
      # the repository.
      - name: Check every table is protected and reachable
        run: pnpm check:tables

      # Two versions of a dually-bundled runtime crash the bundle in ways that
      # look unrelated to dependencies. The rule, and why react-dom is excluded,
      # now live in the script — it was shell here, which meant CI could check it
      # and a person could not, and the pull request template had to tell people
      # to paste a jq one-liner instead. `pnpm verify` runs it.
      - name: Detect duplicate runtime dependencies
        run: pnpm check:duplicate-deps

      # Asking for a re-read belongs to the screen being read, and
      # `data-freshness` puts it on the map. The account menu is where it keeps
      # landing anyway, because a rare control looks like it belongs beside
      # `Sign out` — and no check reads the rows of a menu. It was added in #74,
      # eighteen pull requests after the requirement forbidding it landed in
      # #56, and nothing caught it: it type-checked, it rendered, and it worked.
      # Scoped to that one file, because the map legitimately has one now.
      - name: Check the account menu carries no re-read row
        run: pnpm check:account-menu

      # Reads manifests only, so it needs no install and runs even if the
      # dependency graph is what is broken.
      - name: Check dependency graph
        run: node .github/scripts/check-cycles.mjs

      # `expo prebuild` belongs in apps/mobile. Run at the root it does not fail
      # — Expo installs into the nearest package.json, which in a pnpm workspace
      # is the workspace root — and it adds the app's dependencies there, churns
      # the lockfile, writes a root ios/ with a blank icon, and leaves
      # apps/mobile/ios untouched. It has happened twice. The root ios/ never
      # shows in `git status` because .gitignore is an unscoped `ios/`, so the
      # only trace is an unexplained manifest diff in whatever branch is checked
      # out; the second time it was found three hours later, reviewing something
      # else. A root `preinstall` catches the install Expo itself runs, which is
      # where it is caught on the machine that did it. This step is what catches
      # a marker that reached a pull request anyway — an install with nothing to
      # do runs no lifecycle script, so `preinstall` alone would let a leftover
      # root ios/ through.
      - name: Check the root was not treated as an app
        run: pnpm check:root-prebuild

      # Which workflows OpenSpec generates is a global, per-machine setting
      # whose default profile includes `explore` — so `openspec update` puts
      # back the agent instructions #117 and #130 deliberately removed, on any
      # machine, and nothing in the resulting diff looks wrong. Deleting the
      # files could not record the decision; this is what records it.
      #
      # `always()` because this one is independent of everything above it: a
      # stale lockfile or a duplicated runtime has nothing to do with a file
      # that came back, and the first red step must not hide it until the next
      # push.
      - name: Check the generated OpenSpec workflows
        if: always()
        run: pnpm check:openspec-workflows

      # A change that reaches `main` unarchived leaves openspec/specs/
      # describing the code it just replaced. That is not a lag — after #91 and
      # #139 the markers specification stated the opposite of the implementation,
      # on `main`, for two merges, and every check in this file was green for
      # both. Nothing else can see it: check:specs asks whether a specification
      # is well formed, never whether it is true.
      #
      # Reads the pull request body so a deliberate deferral can say so; see the
      # script for the marker. `always()` for the same reason as the step above —
      # it is independent of everything before it, and a red step earlier must
      # not hide it until the next push.
      - name: Check the change was archived
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm check:unarchived
