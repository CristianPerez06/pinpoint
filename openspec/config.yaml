schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Pinpoint is a map you drop markers on, built for trip planning: save the places
  you want to go, see them all on one map, and share the map with the people you
  are travelling with. The first trip is Japan, but nothing in the product is
  Japan-specific — do not propose Japan-only features or data sources.

  Hard constraint: $0 to build and run. Every dependency must be free with no
  signup, no API key and no usage billing — no Google Maps, Mapbox, or any service
  with a paid tier a free tier can overflow into. The only accepted cost is the
  Apple Developer Program ($99/yr), if the iOS app ever ships.

  Stack: pnpm workspaces. apps/web (Next.js 16, maplibre-gl) and apps/mobile (Expo
  57 development build, @maplibre/maplibre-react-native) over shared packages in
  packages/. OpenFreeMap for tiles, Supabase free tier for Postgres and auth,
  Photon for place search.

  @pinpoint/map has no renderer dependency, because web and mobile draw the map
  with different libraries. Map behaviour lives there as data and pure functions,
  and each app connects it to its own renderer.

  Where things are: `openspec/ROADMAP.md` for what is next, `openspec/specs/` for
  the rules in force, `AGENTS.md` for gotchas and for how to talk to the user.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Write for someone who doesn't write code. Say what changes for the person using the app and why.
    - Keep it short. Name what is not being done rather than designing for it.
  design:
    - Only create design.md when there is a real technical choice to make.
    - One recommendation per decision. List alternatives only if the user asked to compare them.
  tasks:
    - Only what this change needs. Anything noticed along the way goes to findings.md, not the task list.
    - Include tasks for looking at the running apps — defects that type-check and render can still be wrong.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Don't raise bugs or improvements found along the way; add them to findings.md in the change folder. Stop only for a blocker — can't continue, would break or lose data, would cost money.
      - When the tasks are done, archive on the same branch unless the user says otherwise.
  archive:
    guidance:
      - After archiving, present findings.md in a sentence or two per finding. Drop what the user doesn't take up, then delete the file.
