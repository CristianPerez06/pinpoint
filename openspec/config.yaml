schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Pinpoint is a map you drop markers on, built for trip planning: save the places
  you want to go, see them all on one map, and share the map with the people you
  are travelling with. The first trip is Japan, but nothing in the product is
  Japan-specific — do not propose Japan-only features or data sources.

  Hard constraint: $0 to build and run, at every scale this app will realistically
  reach. Every dependency must be free with no signup, no API key, and no usage
  billing. This rules out Google Maps, Mapbox, and any managed geocoding or tile
  service with a paid tier that a free tier can silently overflow into. The only
  accepted paid item is the Apple Developer Program ($99/yr), and only if the iOS
  app ever ships via TestFlight or the App Store. Treat any proposal that
  introduces a metered service as rejected by default.

  Stack, as built:
  - pnpm 11 workspaces, hoisted node linker. Two apps over seven shared packages.
  - apps/web — Next.js 16 App Router, React 19, maplibre-gl 6, @supabase/ssr.
    Built first, and still the only place anything can be written.
  - apps/mobile — Expo 57 with expo-router on a development build (not Expo Go),
    React Native 0.86, @maplibre/maplibre-react-native 11. Read-only today.
  - OpenFreeMap for vector tiles (free, unlimited, no signup); Supabase free tier
    for Postgres and auth; Photon for place search.
  - packages/ — tokens (no third-party deps), map (depends only on tokens),
    core, supabase, auth, data, geocode. Apps depend on packages; packages never
    depend on apps, and `pnpm check:cycles` enforces both.

  The portability boundary is the load-bearing constraint: @pinpoint/map carries
  no renderer, no DOM API, and no native module, because web renders with
  maplibre-gl and native with @maplibre/maplibre-react-native. Map behaviour is
  therefore expressed as data and pure functions — style references, camera
  derivation, marker geometry — and each app binds that to its own renderer. Code
  that needs a renderer dependency belongs in an app. Flag any web-specific choice
  that would not port.

  Undecided, not yet committed — propose only when a change actually needs it, and
  say so explicitly:
  - Protomaps .pmtiles to extract a country into one file for offline maps
    (useful underground or on unreliable data)

  Status: the app can replace the spreadsheet it was built to replace. Auth,
  schema with row-level security on every table, map rendering on both platforms,
  and the full write path (search, drop, edit, remove, cities as the grouping) are
  all in place. Read `openspec/ROADMAP.md` for what is next and why in that order,
  `openspec/specs/` for the rules in force, and `AGENTS.md` for the gotchas that
  have already cost real time. Do not assume a capability is missing without
  checking — but do check, because several things that look present are not, and
  the roadmap's loose ends list is where they are recorded.

  A standing lesson from every change so far: budget for looking, not just for
  building. Each of the last two changes shipped three defects that type-checked,
  rendered, and were wrong — visible only by opening the apps. Tasks that mean
  looking at the running product belong in the task list.

