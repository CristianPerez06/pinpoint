<style>
/* ─── the bottom toolbar — this is the thing being decided ───────────────── */
.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;
     background:var(--surface);border-top:1px solid var(--line);
     box-shadow:var(--shadow-md);
     padding-bottom:22px}            /* the home indicator lives in here */
.bar-row{display:flex;align-items:stretch}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;min-height:56px;padding:9px 4px 7px;background:none;border:0;
      font-family:inherit;cursor:pointer;color:var(--ink-muted);position:relative}
.tool svg{width:24px;height:24px;stroke:currentColor;fill:none;
          stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool span{font-size:11px;font-weight:600;letter-spacing:.006em;line-height:1.1;color:inherit}
/* the primary action carries the accent; the other two stay quiet */
.tool.primary{color:var(--accent-ink)}
.tool.primary svg{stroke-width:2.2}
/* narrowed: the filter tool declares it — filled mark AND a dot, never colour alone */
.tool.on{color:var(--accent-ink)}
.tool .pip{position:absolute;top:7px;left:50%;margin-left:7px;width:7px;height:7px;
           border-radius:50%;background:var(--accent);
           box-shadow:0 0 0 2px var(--surface)}

/* ─── sheets ─────────────────────────────────────────────────────────────── */
.phone.tall{height:830px}
.scrim{position:absolute;inset:0;z-index:6;background:rgba(10,9,8,.34)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--surface);
       border-top:1px solid var(--line);border-radius:20px 20px 0 0;
       box-shadow:0 -3px 16px rgba(0,0,0,.16);display:flex;flex-direction:column;
       max-height:86%;min-height:120px}
.grab{align-self:center;width:38px;height:4px;border-radius:999px;background:var(--line-strong);
      margin:8px 0 4px;flex:none}
.sheet-hd{display:flex;align-items:center;gap:8px;padding:2px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.sheet-hd h3{flex:1;margin:0;font-size:17px;font-weight:700;letter-spacing:-.022em}
.done{background:none;border:0;font-family:inherit;font-size:13.5px;font-weight:700;
      color:var(--accent-ink);cursor:pointer;padding:4px}
.sheet-body{overflow-y:auto;padding-bottom:26px}

.sec{padding:14px 16px 4px}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
       color:var(--ink-muted);margin:0 0 10px}
.rule{height:1px;background:var(--line);margin:12px 16px 0;border:0}

/* a tickable person */
.who{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;background:none;
     border:0;font-family:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);flex:none;
     display:grid;place-items:center;background:var(--surface)}
.box svg{width:14px;height:14px;stroke:var(--ink-on-accent);fill:none;stroke-width:2.6;
         stroke-linecap:round;stroke-linejoin:round;opacity:0}
.who.tick .box{background:var(--accent);border-color:var(--accent)}
.who.tick .box svg{opacity:1}
.who-n{font-size:14px;font-weight:600;letter-spacing:-.012em;flex:1}
.who-m{font-size:12.5px;color:var(--ink-muted)}

/* a switch row */
.sw{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;background:none;border:0;
    font-family:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.sw-n{flex:1;font-size:14px;font-weight:600;letter-spacing:-.012em}
.track{width:44px;height:26px;border-radius:999px;background:var(--line-strong);flex:none;position:relative;transition:background .15s}
.knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on .track{background:var(--accent)}
.sw.on .knob{left:21px}

/* the way out of a narrowed view */
.clear{display:block;width:100%;margin-top:6px;padding:11px;border-radius:var(--radius-md);
       font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
       border:1px solid var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.clear.inert{border-color:transparent;background:var(--surface-muted);color:var(--ink-muted);
             font-weight:500;cursor:default}

/* a row that opens something else */
.go{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;background:none;border:0;
    font-family:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.go-n{flex:1;font-size:14px;font-weight:600;letter-spacing:-.012em}
.go-v{font-size:13px;color:var(--ink-muted);max-width:120px;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
.chev{width:18px;height:18px;stroke:var(--ink-faint);fill:none;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the account block in the hamburger */
.acct{padding:18px 16px 16px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);
    display:grid;place-items:center;font-size:16px;font-weight:800;letter-spacing:-.02em;flex:none;
    border:1px solid var(--accent-ring)}
.acct-n{font-size:17px;font-weight:700;letter-spacing:-.022em;line-height:1.2}
.acct-e{font-size:12.5px;color:var(--ink-muted);line-height:1.35;margin-top:1px;
        overflow-wrap:anywhere}
.out{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;background:none;border:0;
     font-family:inherit;font-size:14px;font-weight:600;color:var(--danger);cursor:pointer;text-align:left}
.out svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;
         stroke-linecap:round;stroke-linejoin:round}

/* a row in the trips list */
.trow{display:flex;align-items:center;gap:11px;width:100%;padding:12px 2px;color:var(--ink)}
.cur{width:20px;height:20px;flex:none;display:grid;place-items:center}
.cur svg{width:17px;height:17px;stroke:var(--accent-ink);fill:none;stroke-width:2.6;
         stroke-linecap:round;stroke-linejoin:round}
.trow-n{flex:1;font-size:15px;font-weight:650;letter-spacing:-.014em}
.trow-m{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.go.new{color:var(--accent-ink)}
.go.new svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;
            stroke-linecap:round;stroke-linejoin:round;flex:none}
.go.new .go-n{color:inherit}
.go.danger{color:var(--danger)}
.go.danger svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;
               stroke-linecap:round;stroke-linejoin:round;flex:none}
.go.danger .go-n{color:inherit}

/* ─── today's bar, for comparison ────────────────────────────────────────── */
.old{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--surface);
     border-top:1px solid var(--line);padding:11px 16px 30px;display:flex;align-items:center;gap:8px}
.opill{border:1px solid var(--line-strong);border-radius:999px;padding:7px 13px;
       font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.opill.na{border-color:transparent;color:var(--ink-muted);font-weight:400;padding:7px 4px}

/* pins */
.pin{position:absolute;width:26px;height:34px;filter:drop-shadow(var(--shadow-pin))}
.pin svg{width:100%;height:100%;overflow:visible}
.pin .drop{fill:var(--see)}
.pin.eat .drop{fill:var(--eat)} .pin.buy .drop{fill:var(--buy)}
.pin.move .drop{fill:var(--move)} .pin.sleep .drop{fill:var(--sleep)}
.pin .g{stroke:var(--marker-fg);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>
