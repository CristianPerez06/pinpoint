<div
  style="
    background: #fbfaf8;
    padding: 24px;
    font-family:
      Figtree,
      -apple-system,
      &quot;Segoe UI&quot;,
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
    color: #1a1917;
  "
>
  <h2 style="margin: 0 0 16px; color: #1a1917">
    Confirmar la cuenta de Pinpoint
  </h2>

  <p style="margin: 0 0 16px; color: #1a1917">
    Para terminar de crear la cuenta, ingresar este código de 6 dígitos en la
    app:
  </p>

  <p
    style="
      display: inline-block;
      margin: 0 0 16px;
      padding: 8px 16px;
      background: #fbf1df;
      border: 1px solid #e39a2b;
      border-radius: 8px;
      color: #8a5a0b;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 4px;
    "
  >
    {{ .Token }}
  </p>

  <p style="margin: 0; color: #6e6a63">
    El código vence en 1 hora. Si no se pidió este código, ignorar este mensaje.
  </p>
</div>
