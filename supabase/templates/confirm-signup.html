<div
  style="
    background: #f6f4fb;
    padding: 24px;
    font-family:
      Figtree,
      -apple-system,
      &quot;Segoe UI&quot;,
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
    color: #1a1626;
  "
>
  <h2 style="margin: 0 0 16px; color: #1a1626">
    Confirmar la cuenta de Pinpoint
  </h2>

  <p style="margin: 0 0 16px; color: #1a1626">
    Para terminar de crear la cuenta, ingresar este código de 6 dígitos en la
    app:
  </p>

  <p
    style="
      display: inline-block;
      margin: 0 0 16px;
      padding: 8px 16px;
      background: #f0e9fd;
      border: 1px solid #7a35dc;
      border-radius: 8px;
      color: #6227c0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 4px;
    "
  >
    {{ .Token }}
  </p>

  <p style="margin: 0; color: #625c72">
    El código vence en 1 hora. Si no se pidió este código, ignorar este mensaje.
  </p>
</div>
